name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        # Keep Windows on the VS 2022 image. windows-latest currently resolves
        # to an image with Visual Studio 18, which node-gyp does not recognize.
        os: [ubuntu-latest, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path native/ytk-memory -Filter *.go -Recurse |
            ForEach-Object FullName
          $unformatted = gofmt -l $files
          if ($unformatted) {
            $unformatted
            exit 1
          }
      - run: go vet ./...
        working-directory: native/ytk-memory
      - run: go test ./...
        working-directory: native/ytk-memory
      - name: Build ytk-memory
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP ytk-memory) ./cmd/ytk-memory
        working-directory: native/ytk-memory

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Build release helper
        run: go build -o "$RUNNER_TEMP/ytk-memory-release" ./cmd/ytk-memory
        working-directory: native/ytk-memory
      - name: Package and upload signed releases
        env:
          YTK_MEMORY_SIGNING_PRIVATE_KEY: ${{ secrets.YTK_MEMORY_SIGNING_PRIVATE_KEY }}
          YTK_MEMORY_SIGNING_PUBLIC_KEY: ${{ vars.YTK_MEMORY_SIGNING_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${YTK_MEMORY_SIGNING_PRIVATE_KEY:?YTK_MEMORY_SIGNING_PRIVATE_KEY is required for an approved release.}"
          : "${YTK_MEMORY_SIGNING_PUBLIC_KEY:?YTK_MEMORY_SIGNING_PUBLIC_KEY repository variable is required for an approved release.}"
          version="${GITHUB_REF_NAME#v}"
          release_dir="$RUNNER_TEMP/release-output"
          mkdir -p "$release_dir"
          upload_files=()

          for target in "linux amd64" "windows amd64" "darwin arm64"; do
            read -r goos goarch <<< "$target"
            echo "Packaging $goos/$goarch for $version"
            package_json="$("$RUNNER_TEMP/ytk-memory-release" release package \
              --module-dir "$GITHUB_WORKSPACE/native/ytk-memory" \
              --output "$release_dir" \
              --version "$version" \
              --goos "$goos" \
              --goarch "$goarch" \
              --json)"
            artifact="$(jq -er '.artifact' <<< "$package_json")"
            public_key="$(jq -er '.publicKey' <<< "$package_json")"
            [[ -s "$artifact" ]] || { echo "Package did not create $artifact" >&2; exit 1; }
            [[ -s "$public_key" ]] || { echo "Package did not create $public_key" >&2; exit 1; }
            actual_public_key="$(tr -d '\r\n' < "$public_key")"
            [[ "$actual_public_key" == "$YTK_MEMORY_SIGNING_PUBLIC_KEY" ]] || {
              echo "Release public key for $goos/$goarch does not match YTK_MEMORY_SIGNING_PUBLIC_KEY." >&2
              exit 1
            }
            for suffix in ".manifest.json" ".sig" ".pub" ".sha256"; do
              companion="${artifact}${suffix}"
              [[ -s "$companion" ]] || { echo "Package did not create $companion" >&2; exit 1; }
              upload_files+=("$companion")
            done
            upload_files+=("$artifact")

            if [[ "$goos" == "linux" ]]; then
              smoke_dir="$RUNNER_TEMP/release-smoke-linux"
              mkdir -p "$smoke_dir"
              tar -xzf "$artifact" -C "$smoke_dir"
              actual_version="$("$smoke_dir/ytk-memory" version)"
              [[ "$actual_version" == "$version" ]] || {
                echo "Packaged Linux binary version '$actual_version' does not match '$version'." >&2
                exit 1
              }
            elif [[ "$goos" == "windows" ]]; then
              unzip -t "$artifact"
            else
              tar -tzf "$artifact" | grep -Fx 'ytk-memory'
            fi
          done

          [[ "${#upload_files[@]}" -eq 15 ]] || {
            echo "Expected 15 release files, collected ${#upload_files[@]}." >&2
            exit 1
          }
          gh release upload "$GITHUB_REF_NAME" "${upload_files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          if release_json="$(gh release view "$tag" --repo "$repo" --json isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag already exists and is published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$tag" --repo "$repo" --draft --verify-tag --generate-notes --title "$tag"
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --dir release --repo "$GITHUB_REPOSITORY"
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifacts=(
            "ytk-memory_${version}_linux_amd64.tar.gz"
            "ytk-memory_${version}_windows_amd64.zip"
            "ytk-memory_${version}_darwin_arm64.tar.gz"
          )
          for base in "${artifacts[@]}"; do
            artifact="release/${base}"
            for path in "$artifact" "${artifact}.manifest.json" "${artifact}.sig" "${artifact}.pub" "${artifact}.sha256"; do
              if [[ ! -s "$path" ]]; then
                echo "Missing or empty release asset: $path" >&2
                echo "Downloaded assets:" >&2
                find release -maxdepth 1 -type f -printf '%f\n' | sort >&2
                exit 1
              fi
            done
            grep -F "$base" "${artifact}.sha256"
          done
      - name: Verify signatures before publication
        shell: bash
        run: |
          set -euo pipefail
          cd native/ytk-memory
          go build -o "$RUNNER_TEMP/ytk-memory-release" ./cmd/ytk-memory
          version="${GITHUB_REF_NAME#v}"
          artifacts=(
            "ytk-memory_${version}_linux_amd64.tar.gz"
            "ytk-memory_${version}_windows_amd64.zip"
            "ytk-memory_${version}_darwin_arm64.tar.gz"
          )
          for base in "${artifacts[@]}"; do
            artifact="$GITHUB_WORKSPACE/release/${base}"
            manifest="${artifact}.manifest.json"
            "$RUNNER_TEMP/ytk-memory-release" release verify \
              --artifact "$artifact" \
              --manifest "$manifest" \
              --signature "${artifact}.sig" \
              --public-key "${artifact}.pub"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
