name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        # Keep Windows on the VS 2022 image. windows-latest currently resolves
        # to an image with Visual Studio 18, which node-gyp does not recognize.
        os: [ubuntu-latest, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path native/ytk-memory -Filter *.go -Recurse |
            ForEach-Object FullName
          $unformatted = gofmt -l $files
          if ($unformatted) {
            $unformatted
            exit 1
          }
      - run: go vet ./...
        working-directory: native/ytk-memory
      - run: go test ./...
        working-directory: native/ytk-memory
      - name: Build ytk-memory
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP ytk-memory) ./cmd/ytk-memory
        working-directory: native/ytk-memory

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, prepare-release]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-2022
            goos: windows
            goarch: amd64
          - os: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Build release helper
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP 'ytk-memory-release') ./cmd/ytk-memory
        working-directory: native/ytk-memory
      - name: Package signed release
        shell: pwsh
        env:
          YTK_MEMORY_SIGNING_PRIVATE_KEY: ${{ secrets.YTK_MEMORY_SIGNING_PRIVATE_KEY }}
          YTK_MEMORY_SIGNING_PUBLIC_KEY: ${{ vars.YTK_MEMORY_SIGNING_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:YTK_MEMORY_SIGNING_PRIVATE_KEY) { throw 'YTK_MEMORY_SIGNING_PRIVATE_KEY is required for an approved release.' }
          if (-not $env:YTK_MEMORY_SIGNING_PUBLIC_KEY) { throw 'YTK_MEMORY_SIGNING_PUBLIC_KEY repository variable is required for an approved release.' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $packageJson = & (Join-Path $env:RUNNER_TEMP 'ytk-memory-release') release package --module-dir (Join-Path $env:GITHUB_WORKSPACE 'native/ytk-memory') --output $releaseDir --version $version --goos '${{ matrix.goos }}' --goarch '${{ matrix.goarch }}' --json
          $packageExitCode = $LASTEXITCODE
          if ($packageExitCode -ne 0) { exit $packageExitCode }
          $package = $packageJson | ConvertFrom-Json
          $artifactPath = [string]$package.artifact
          $publicKeyPath = [string]$package.publicKey
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            $files = (Get-ChildItem -LiteralPath $releaseDir -File | ForEach-Object Name) -join ', '
            throw "Release package did not create its reported artifact '$artifactPath'. Files in output directory: $files"
          }
          if (-not (Test-Path -LiteralPath $publicKeyPath -PathType Leaf)) { throw "Release package did not create its reported public key '$publicKeyPath'." }
          $publicKey = (Get-Content -LiteralPath $publicKeyPath -Raw).Trim()
          if ($publicKey -cne $env:YTK_MEMORY_SIGNING_PUBLIC_KEY.Trim()) { throw 'Release public key does not match YTK_MEMORY_SIGNING_PUBLIC_KEY.' }
          $artifact = Get-Item -LiteralPath $artifactPath
          $extract = Join-Path $env:RUNNER_TEMP 'release-smoke'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          if ($artifact.Extension -eq '.zip') {
            Expand-Archive -LiteralPath $artifact.FullName -DestinationPath $extract
          } else {
            tar -xzf $artifact.FullName -C $extract
            if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the release archive.' }
          }
          $binary = Get-ChildItem -LiteralPath $extract -File -Recurse | Where-Object { $_.Name -match '^ytk-memory(\.exe)?$' } | Select-Object -First 1
          if (-not $binary) { throw 'Packaged ytk-memory binary is missing.' }
          $actual = (& $binary.FullName version).Trim()
          if ($actual -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "Packaged binary version '$actual' does not match tag '$env:GITHUB_REF_NAME'." }
          $releaseFiles = Get-ChildItem -LiteralPath $releaseDir -File
          if ($releaseFiles.Count -ne 5) {
            $names = ($releaseFiles | ForEach-Object Name) -join ', '
            throw "Expected five release files in '$releaseDir', found $($releaseFiles.Count): $names"
          }
          $uploadPaths = @($releaseFiles | ForEach-Object { $_.FullName })
          & gh release upload $env:GITHUB_REF_NAME @uploadPaths --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets for $env:GITHUB_REF_NAME." }

  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          if release_json="$(gh release view "$tag" --repo "$repo" --json isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag already exists and is published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$tag" --repo "$repo" --draft --verify-tag --generate-notes --title "$tag"
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" --dir release --repo "$GITHUB_REPOSITORY"
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifacts=(
            "ytk-memory_${version}_linux_amd64.tar.gz"
            "ytk-memory_${version}_windows_amd64.zip"
            "ytk-memory_${version}_darwin_arm64.tar.gz"
          )
          for base in "${artifacts[@]}"; do
            artifact="release/${base}"
            manifest="${artifact}.manifest.json"
            test -s "$artifact"
            test -s "$manifest"
            test -s "${artifact}.sig"
            test -s "${artifact}.pub"
            test -s "${artifact}.sha256"
            grep -F "$base" "${artifact}.sha256"
          done
      - name: Verify signatures before publication
        shell: bash
        run: |
          set -euo pipefail
          cd native/ytk-memory
          go build -o "$RUNNER_TEMP/ytk-memory-release" ./cmd/ytk-memory
          version="${GITHUB_REF_NAME#v}"
          artifacts=(
            "ytk-memory_${version}_linux_amd64.tar.gz"
            "ytk-memory_${version}_windows_amd64.zip"
            "ytk-memory_${version}_darwin_arm64.tar.gz"
          )
          for base in "${artifacts[@]}"; do
            artifact="$GITHUB_WORKSPACE/release/${base}"
            manifest="${artifact}.manifest.json"
            "$RUNNER_TEMP/ytk-memory-release" release verify \
              --artifact "$artifact" \
              --manifest "$manifest" \
              --signature "${artifact}.sig" \
              --public-key "${artifact}.pub"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
