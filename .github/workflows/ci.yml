name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run
      - run: npm run test:context-evaluation
      - run: npm run package:check
      - run: npm run release:check
      - run: npm run migrations:check
      - run: npm run pack:check
      - run: npm run test:consumer
      - run: npm run test:mcp-smoke
      - run: npm run test:agent-memory-e2e
      - run: npm run release:internal
      - uses: actions/upload-artifact@v4
        with:
          name: internal-release-${{ matrix.os }}
          path: artifacts/*.tgz
