name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        # Keep Windows on the VS 2022 image. windows-latest currently resolves
        # to an image with Visual Studio 18, which node-gyp does not recognize.
        os: [ubuntu-latest, windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path native/ytk-memory -Filter *.go -Recurse |
            ForEach-Object FullName
          $unformatted = gofmt -l $files
          if ($unformatted) {
            $unformatted
            exit 1
          }
      - run: go vet ./...
        working-directory: native/ytk-memory
      - run: go test ./...
        working-directory: native/ytk-memory
      - name: Build ytk-memory
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP ytk-memory) ./cmd/ytk-memory
        working-directory: native/ytk-memory

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-2022
            goos: windows
            goarch: amd64
          - os: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - name: Build release helper
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP 'ytk-memory-release') ./cmd/ytk-memory
        working-directory: native/ytk-memory
      - name: Package signed release
        shell: pwsh
        env:
          YTK_MEMORY_SIGNING_PRIVATE_KEY: ${{ secrets.YTK_MEMORY_SIGNING_PRIVATE_KEY }}
          YTK_MEMORY_SIGNING_PUBLIC_KEY: ${{ vars.YTK_MEMORY_SIGNING_PUBLIC_KEY }}
        run: |
          if (-not $env:YTK_MEMORY_SIGNING_PRIVATE_KEY) { throw 'YTK_MEMORY_SIGNING_PRIVATE_KEY is required for an approved release.' }
          if (-not $env:YTK_MEMORY_SIGNING_PUBLIC_KEY) { throw 'YTK_MEMORY_SIGNING_PUBLIC_KEY repository variable is required for an approved release.' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          & (Join-Path $env:RUNNER_TEMP 'ytk-memory-release') release package --module-dir (Join-Path $env:GITHUB_WORKSPACE 'native/ytk-memory') --output $releaseDir --version $version --goos '${{ matrix.goos }}' --goarch '${{ matrix.goarch }}' --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publicKeyFile = Get-ChildItem -LiteralPath $releaseDir -File -Filter '*.pub' | Select-Object -First 1
          if (-not $publicKeyFile) { throw "Release package did not create a public key in '$releaseDir'." }
          $publicKey = (Get-Content -LiteralPath $publicKeyFile.FullName -Raw).Trim()
          if ($publicKey -cne $env:YTK_MEMORY_SIGNING_PUBLIC_KEY.Trim()) { throw 'Release public key does not match YTK_MEMORY_SIGNING_PUBLIC_KEY.' }
      - name: Validate packaged binary
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          $artifact = Get-ChildItem -LiteralPath $releaseDir -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' } | Select-Object -First 1
          if (-not $artifact) { throw 'Release artifact is missing.' }
          $extract = Join-Path $env:RUNNER_TEMP 'release-smoke'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          if ($artifact.Extension -eq '.zip') {
            Expand-Archive -LiteralPath $artifact.FullName -DestinationPath $extract
          } else {
            tar -xzf $artifact.FullName -C $extract
            if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the release archive.' }
          }
          $binary = Get-ChildItem -LiteralPath $extract -File -Recurse | Where-Object { $_.Name -match '^ytk-memory(\.exe)?$' } | Select-Object -First 1
          if (-not $binary) { throw 'Packaged ytk-memory binary is missing.' }
          $actual = (& $binary.FullName version).Trim()
          if ($actual -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "Packaged binary version '$actual' does not match tag '$env:GITHUB_REF_NAME'." }
      - uses: actions/upload-artifact@v4
        with:
          name: ytk-memory-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-output/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/ytk-memory/go.mod
          cache-dependency-path: native/ytk-memory/go.sum
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: ytk-memory-*
          merge-multiple: true
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          for manifest in release/*.manifest.json; do
            artifact="${manifest%.manifest.json}"
            base="$(basename "$artifact")"
            test -s "$artifact"
            test -s "${artifact}.sig"
            test -s "${artifact}.pub"
            test -s "${artifact}.sha256"
            grep -F "$base" "${artifact}.sha256"
          done
      - name: Verify signatures before publication
        shell: bash
        run: |
          set -euo pipefail
          cd native/ytk-memory
          go build -o "$RUNNER_TEMP/ytk-memory-release" ./cmd/ytk-memory
          for manifest in "$GITHUB_WORKSPACE"/release/*.manifest.json; do
            artifact="${manifest%.manifest.json}"
            "$RUNNER_TEMP/ytk-memory-release" release verify \
              --artifact "$artifact" \
              --manifest "$manifest" \
              --signature "${artifact}.sig" \
              --public-key "${artifact}.pub"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
